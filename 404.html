<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faqja nuk u gjet | LET Center</title>
<meta name="robots" content="noindex">
<script>
  // GitHub Pages serves this file for any missing path, so resolve assets from the site root.
  // Project sites live under /<repo>/, user sites and custom domains under /.
  (function(){if(location.protocol.indexOf('http')!==0)return;var p=location.pathname.split('/');var b=(location.hostname.slice(-10)==='github.io'&&p.length>2)?'/'+p[1]+'/':'/';document.write('<base href="'+b+'">');})();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .nf{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--petal);padding:40px 20px;text-align:center}
  .nf-box{max-width:560px;display:flex;flex-direction:column;align-items:center;gap:22px}
  .nf-dia{width:120px;aspect-ratio:1;border-radius:28px;background:var(--sun);transform:rotate(45deg);display:flex;align-items:center;justify-content:center}
  .nf-dia img{width:74px;height:76px;border-radius:14px;transform:rotate(-45deg)}
  .nf h1{font-size:clamp(34px,6vw,52px)}
  .nf p{font-size:18px;color:var(--ink-2);line-height:1.6}
  .nf .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<main class="nf">
  <div class="nf-box">
    <div class="nf-dia"><img src="assets/img/let-mark.webp" alt="LET Center"></div>
    <h1>Kjo degë nuk ka faqe.</h1>
    <p>Faqja që kërkoni nuk ekziston ose është zhvendosur.<br><span lang="en">This page doesn't exist or has moved.</span></p>
    <div class="actions">
      <a class="btn btn-primary" href="./">Kthehu në faqen kryesore</a>
      <a class="btn btn-outline" href="./?lang=en" lang="en">Go to homepage</a>
    </div>
  </div>
</main>
</body>
</html>
